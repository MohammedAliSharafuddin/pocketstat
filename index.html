<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script
      src="./shinylive/load-shinylive-sw.js"
      type="module"
    ></script>
    <script type="module">
      import { runExportedApp } from "./shinylive/shinylive.js";
      runExportedApp({
        id: "root",
        appEngine: "r",
        relPath: "",
      });
    </script>
    <link rel="stylesheet" href="./shinylive/style-resets.css" />
    <link rel="stylesheet" href="./shinylive/shinylive.css" />
    
  
    <title>PocketStat</title>
    <meta name="description" content="Statistics in your browser. R runs on your own device, nothing is uploaded." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23063970'/%3E%3Crect x='7' y='17' width='4' height='9' fill='white'/%3E%3Crect x='14' y='12' width='4' height='14' fill='white'/%3E%3Crect x='21' y='7' width='4' height='19' fill='white'/%3E%3C/svg%3E" />
    <style>
      #ps-boot {
        position: fixed; inset: 0; z-index: 500;
        background: #f6f5f1; color: #063970;
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px; text-align: center;
        transition: opacity .35s ease;
      }
      #ps-boot.ps-done { opacity: 0; pointer-events: none; }
      .ps-box { max-width: 380px; }
      .ps-mark { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
      .ps-sub { font-size: 14px; color: #4a5570; margin-top: 4px; }
      .ps-bar {
        height: 4px; width: 100%%; margin: 22px 0 14px;
        background: #dedad0; border-radius: 999px; overflow: hidden;
      }
      .ps-bar span {
        display: block; height: 100%%; width: 40%%; border-radius: 999px;
        background: #063970; animation: ps-slide 1.4s ease-in-out infinite;
      }
      @keyframes ps-slide {
        0%%   { transform: translateX(-100%%); }
        100%% { transform: translateX(350%%); }
      }
      .ps-status { font-size: 14px; font-weight: 600; }
      .ps-note { font-size: 12.5px; color: #4a5570; margin-top: 10px; line-height: 1.5; }
      @media (prefers-reduced-motion: reduce) {
        .ps-bar span { animation: none; width: 100%%; opacity: .35; }
        #ps-boot { transition: none; }
      }
    </style>
  </head>
  <body>
    
    <div style="height: 100vh; width: 100vw" id="root"></div>
    
  
    <div id="ps-boot" role="status" aria-live="polite">
      <div class="ps-box">
        <div class="ps-mark">PocketStat</div>
        <div class="ps-sub">Statistics, in your browser</div>
        <div class="ps-bar"><span></span></div>
        <div class="ps-status">Starting R on your device</div>
        <p class="ps-note">
          The first visit downloads R itself, about 73&nbsp;MB, so this can take
          a minute on a slow connection. It is stored afterwards, so later
          visits start quickly and work offline.
        </p>
      </div>
    </div>
    <script>
      // Clear the splash once the app has actually rendered, not merely when
      // the iframe element appears: shinylive inserts the frame early and
      // fills it later, so watching for the element alone uncovers a blank
      // white page. Poll the frame document instead, and give up after 5
      // minutes so a failed boot cannot leave the splash covering an error.
      (function () {
        var el = document.getElementById("ps-boot");
        if (!el) return;
        var started = Date.now();
        var t = setInterval(function () {
          var done = false;
          try {
            var f = document.querySelector("#root iframe");
            done = !!(f && f.contentDocument && f.contentDocument.body &&
                      f.contentDocument.body.innerText.trim().length > 20);
          } catch (e) { done = true; }   // cross-origin means it is up
          if (done || Date.now() - started > 300000) {
            clearInterval(t);
            el.classList.add("ps-done");
            setTimeout(function () { el.remove(); }, 400);
          }
        }, 250);
      })();
    </script>
  </body>
</html>
